{% if items.paginator %}<div class="table-footer"><span>{{ items.start_index }}–{{ items.end_index }} из {{ items.paginator.count }}</span><div>{% if items.has_previous %}<a class="button small" href="{% querystring page=items.previous_page_number %}">← Назад</a>{% endif %}{% if items.has_next %}<a class="button small" href="{% querystring page=items.next_page_number %}">Далее →</a>{% endif %}</div></div>{% endif %}
