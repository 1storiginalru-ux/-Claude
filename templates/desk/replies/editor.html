{% if can_manage %}<section class="panel padded"><h2>{% if item.pk %}Редактирование{% else %}Добавить{% endif %}</h2><form method="post" class="workbench-form">{% csrf_token %}<input type="hidden" name="company" value="{{ selected_company.pk }}"><input type="hidden" name="version" value="{% if item.version %}{{ item.version }}{% elif item.updated_at %}{{ item.updated_at|date:'c' }}{% endif %}">{{ form.as_p }}<button class="button primary">Сохранить</button></form></section>{% endif %}
