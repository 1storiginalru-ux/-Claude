<div class="tabs reply-tabs"><a href="{% url 'reply_drafts' %}">Черновики</a><a href="{% url 'reply_materials' %}{% if selected_company %}?company={{ selected_company.pk }}{% endif %}">Примеры и шаблоны</a><a href="{% url 'reply_knowledge' %}{% if selected_company %}?company={{ selected_company.pk }}{% endif %}">Знания товаров</a><a href="{% url 'reply_rules' %}{% if selected_company %}?company={{ selected_company.pk }}{% endif %}">Сценарии</a><a href="{% url 'reply_tests' %}">Испытания</a></div>
