{% load static %}<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход · Voice</title><link rel="stylesheet" href="{% static 'app.css' %}"></head><body class="login-page"><div class="login-brand"><span class="logo-mark">v</span> voice.</div><section class="login-card"><span class="eyebrow">ЕДИНОЕ ПРОСТРАНСТВО КОММУНИКАЦИЙ</span><h1>Слышать клиента.<br>Видеть больше.</h1><p>Войдите в рабочее пространство вашей команды.</p><form method="post">{% csrf_token %}{% if form.errors %}<div class="notice error">Проверьте имя пользователя и пароль.</div>{% endif %}<label>Имя пользователя<input name="username" autocomplete="username" required autofocus></label><label>Пароль<input type="password" name="password" autocomplete="current-password" required></label><input type="hidden" name="next" value="{{ next }}"><button class="button primary full">Войти в Voice →</button></form></section><p class="login-caption">Один диалог. Полный контекст. Осмысленный ответ.</p></body></html>
